[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bankcsv"
version = "0.0.2"
description = "Load and merge bank CSV statement exports into a normalised pandas DataFrame."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Phil Massyn", email = "phil.massyn@icloud.com" }]
keywords = ["bank", "csv", "statements", "transactions", "pandas"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
]
dependencies = ["pandas>=2.0", "python-dotenv>=1.0"]

[project.urls]
Homepage = "https://github.com/massyn/bankcsv"
Source = "https://github.com/massyn/bankcsv"

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/bankcsv"]

[tool.ruff]
target-version = "py310"

[tool.black]
target-version = ["py310"]
