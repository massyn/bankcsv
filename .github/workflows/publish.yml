name: Build and Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade twine
          python -m twine upload --non-interactive --skip-existing dist/*

  notify:
    needs: [build, publish]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          if [ -z "${SLACK_WEBHOOK}" ]; then
            echo "SLACK_WEBHOOK not set; skipping notification."
            exit 0
          fi

          if [ "${{ needs.publish.result }}" = "success" ]; then
            status="success"
            emoji=":white_check_mark:"
            text="Published *${{ github.repository }}* \`${{ github.ref_name }}\` to PyPI."
          else
            status="failure"
            emoji=":x:"
            text="Build/publish of *${{ github.repository }}* \`${{ github.ref_name }}\` failed (build: ${{ needs.build.result }}, publish: ${{ needs.publish.result }})."
          fi

          payload=$(printf '{"text":"%s %s\n%s\n<%s/actions/runs/%s|View workflow run>"}' \
            "${emoji}" "${status}" "${text}" \
            "${{ github.server_url }}/${{ github.repository }}" "${{ github.run_id }}")

          curl -sSf -X POST -H 'Content-type: application/json' \
            --data "${payload}" "${SLACK_WEBHOOK}"
