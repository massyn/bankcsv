name: Build and Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade twine
          python -m twine upload --non-interactive --skip-existing --verbose dist/*

  notify:
    needs: [build, publish]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "${SLACK_WEBHOOK}" ]; then
            echo "SLACK_WEBHOOK not set; skipping notification."
            exit 0
          fi

          if [ "${PUBLISH_RESULT}" = "success" ]; then
            status="success"
            emoji=":white_check_mark:"
            text="Published *${REPOSITORY}* \`${REF_NAME}\` to PyPI."
          else
            status="failure"
            emoji=":x:"
            text="Build/publish of *${REPOSITORY}* \`${REF_NAME}\` failed (build: ${BUILD_RESULT}, publish: ${PUBLISH_RESULT})."
          fi

          payload=$(printf '{"text":"%s %s\n%s\n<%s/actions/runs/%s|View workflow run>"}' \
            "${emoji}" "${status}" "${text}" \
            "${SERVER_URL}/${REPOSITORY}" "${RUN_ID}")

          curl -sSf -X POST -H 'Content-type: application/json' \
            --data "${payload}" "${SLACK_WEBHOOK}"
